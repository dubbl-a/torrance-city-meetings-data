name: pr-checks
# Target wall time under one minute, so the feedback loop beats a local run.
#
# This repo holds documentation, a generated schema file and SQL. There is no
# package manifest, no build and no test suite, so the whole gate is the house
# checker.
#
# Deliberately NOT gated here:
#   - the queries in queries/, which need the reader credential. They are run by
#     hand against the live database before a change to one is merged.
on:
  pull_request:
  workflow_dispatch:
  # Deliberately no `push:` trigger on the protected branch. pull_request
  # already covers every merge, and adding push would bill every commit twice.
permissions:
  contents: read # Read-only checkout; no comment/issue/PR mutation from this workflow.
concurrency:
  # A new push supersedes the run it is checking, so cancelling the stale run
  # is correct here.
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node .house/check.mjs
